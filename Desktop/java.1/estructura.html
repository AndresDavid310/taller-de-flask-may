<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">
        <h2>Calculadora de Promedio</h2>

        <label>Nombre del aprendiz</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre">

        <label>Nota 1</label>
        <input type="number" id="nota1" step="0.1">

        <label>Nota 2</label>
        <input type="number" id="nota2" step="0.1">

        <label>Nota 3</label>
        <input type="number" id="nota3" step="0.1">

        <button onclick="calcular()">Calcular promedio</button>

        <div>
            <p id="resultado"></p>
        </div>
    </div>

    <script src="inteligencia.js"></script>

</body>

</html>
